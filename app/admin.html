<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TóthBüfé – Admin Panel</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230D0D1F"/><rect x="25" y="25" width="50" height="50" rx="8" fill="%23F4845F"/></svg>' />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #06060F;
      --surface:   #0D0D1F;
      --card:      rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --teal:      #00D4AA;
      --teal-dim:  rgba(0,212,170,0.12);
      --purple:    #8B5CF6;
      --coral:     #F4845F;
      --yellow:    #F5C518;
      --text:      #E8E8F0;
      --muted:     #6B7280;
      --ff:        'Outfit', sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--ff); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOGIN OVERLAY */
    #loginOverlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 2rem;
    }
    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 2.5rem 2rem;
      width: 100%; max-width: 360px;
      text-align: center;
    }
    .login-card .icon { font-size: 3rem; margin-bottom: 1rem; }
    .login-card h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: .4rem; }
    .login-card p { color: var(--muted); font-size: .875rem; margin-bottom: 2rem; }
    .login-card input {
      width: 100%; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px;
      padding: .875rem 1rem; color: var(--text);
      font-family: var(--ff); font-size: 1rem;
      outline: none; margin-bottom: 1rem;
      transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--coral); }
    .login-error { color: var(--coral); font-size: .8rem; margin-bottom: 1rem; display: none; }

    /* HEADER */
    header {
      background: rgba(6,6,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: .75rem; }
    .admin-badge {
      background: rgba(244,132,95,.15); color: var(--coral);
      border: 1px solid rgba(244,132,95,.3);
      font-size: .65rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; padding: .2rem .6rem; border-radius: 6px;
    }
    .nav-logo { font-weight: 900; font-size: 1.1rem; }
    .nav-logo span { color: var(--coral); }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--teal);
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .live-label { font-size: .78rem; color: var(--muted); font-family: var(--mono); }
    .btn-logout {
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: .4rem .8rem;
      color: var(--muted); cursor: pointer; font-family: var(--ff);
      font-size: .8rem; transition: border-color .2s, color .2s;
    }
    .btn-logout:hover { border-color: var(--coral); color: var(--coral); }

    /* STATS */
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1px; background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-cell {
      background: var(--bg);
      padding: 1.25rem 1.5rem;
      text-align: center;
    }
    .stat-val {
      font-size: 1.75rem; font-weight: 900;
      font-family: var(--mono); line-height: 1;
    }
    .stat-label { font-size: .72rem; color: var(--muted); margin-top: .3rem; }
    .c-teal   { color: var(--teal); }
    .c-purple { color: var(--purple); }
    .c-coral  { color: var(--coral); }
    .c-yellow { color: var(--yellow); }

    /* MAIN */
    main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* TABS */
    .tabs {
      display: flex; gap: .5rem; margin-bottom: 2rem;
      border-bottom: 1px solid var(--border); padding-bottom: 0;
    }
    .tab {
      padding: .6rem 1.25rem; border-radius: 8px 8px 0 0;
      border: 1px solid transparent; border-bottom: none;
      font-size: .875rem; font-weight: 700; cursor: pointer;
      background: none; color: var(--muted); font-family: var(--ff);
      transition: color .2s, background .2s, border-color .2s;
      position: relative; bottom: -1px;
    }
    .tab.active {
      background: var(--bg); color: var(--text);
      border-color: var(--border) var(--border) var(--bg);
    }
    .tab .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--coral); color: #fff;
      font-size: .65rem; font-weight: 800; margin-left: .4rem;
    }

    /* ORDER CARDS */
    .orders-list { display: flex; flex-direction: column; gap: .75rem; }
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 1.25rem 1.5rem;
      display: flex; align-items: center; gap: 1.25rem;
      animation: slideIn .3s ease;
      transition: border-color .3s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .order-card.status-pending { border-left: 3px solid var(--teal); }
    .order-card.status-ready   { border-left: 3px solid var(--purple); }
    .order-card.status-done    { border-left: 3px solid var(--muted); opacity: .5; }

    .order-emoji { font-size: 2rem; flex-shrink: 0; }
    .order-info { flex: 1; min-width: 0; }
    .order-name { font-weight: 700; font-size: .95rem; }
    .order-detail { font-size: .8rem; color: var(--muted); margin-top: .15rem; }
    .order-time {
      font-size: .7rem; font-family: var(--mono); color: var(--muted);
      white-space: nowrap;
    }
    .order-actions { display: flex; gap: .5rem; flex-shrink: 0; }

    .btn-action {
      padding: .5rem 1rem; border-radius: 8px;
      border: none; cursor: pointer; font-family: var(--ff);
      font-size: .8rem; font-weight: 700;
      transition: transform .15s, opacity .2s;
    }
    .btn-action:hover { transform: scale(1.05); }
    .btn-action:active { transform: scale(.98); }
    .btn-ready { background: var(--purple); color: #fff; }
    .btn-done  { background: var(--teal);   color: #06060F; }
    .btn-done-state {
      background: rgba(0,212,170,.1); color: var(--teal);
      border: 1px solid rgba(0,212,170,.3);
      border-radius: 8px; padding: .4rem .75rem;
      font-size: .78rem; font-weight: 700;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

    /* LOADING */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      gap: 1rem; color: var(--muted); padding: 3rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .75rem 1.5rem; border-radius: 10px; border: none;
      cursor: pointer; font-family: var(--ff); font-size: .9rem;
      font-weight: 700; transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--teal); color: #06060F; }

    /* NOTIFICATION */
    .notif {
      position: fixed; top: 5rem; right: 1.5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1rem 1.25rem;
      font-size: .875rem; font-weight: 600;
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
      transform: translateX(120%); transition: transform .35s cubic-bezier(.4,0,.2,1);
      z-index: 200; max-width: 280px;
    }
    .notif.show { transform: translateX(0); }
    .notif.new-order { border-color: rgba(0,212,170,.4); }
    .notif-title { color: var(--teal); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
    .notif-body { margin-top: .25rem; }

    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .order-card { flex-wrap: wrap; }
      .order-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="icon">🔐</div>
    <h2>Admin belépés</h2>
    <p>A büfés panel csak jogosult felhasználóknak elérhető.</p>
    <input type="password" id="pwInput" placeholder="Admin jelszó" onkeydown="if(event.key==='Enter')login()" />
    <div class="login-error" id="loginError">Hibás jelszó!</div>
    <button class="btn btn-primary" onclick="login()" style="width:100%">Belépés →</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="nav-logo">TóthBüfé <span>Admin</span></div>
    <span class="admin-badge">Büfés panel</span>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:.4rem;">
      <div class="live-dot"></div>
      <span class="live-label">REALTIME</span>
    </div>
    <button class="btn-logout" onclick="logout()">Kilépés</button>
  </div>
</header>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat-cell">
    <div class="stat-val c-coral" id="statPending">–</div>
    <div class="stat-label">⏳ Várakozó</div>
  </div>
  <div class="stat-cell">
    <div class="stat-val c-purple" id="statReady">–</div>
    <div class="stat-label">🔔 Kész</div>
  </div>
  <div class="stat-cell">
    <div class="stat-val c-teal" id="statDone">–</div>
    <div class="stat-label">✅ Átvett ma</div>
  </div>
  <div class="stat-cell">
    <div class="stat-val c-yellow" id="statRevenue">–</div>
    <div class="stat-label">💰 Mai bevétel (Ft)</div>
  </div>
</div>

<!-- MAIN -->
<main>
  <div class="tabs">
    <button class="tab active" id="tab-pending" onclick="switchTab('pending')">
      Várakozó <span class="tab-count" id="cnt-pending">0</span>
    </button>
    <button class="tab" id="tab-ready" onclick="switchTab('ready')">
      Kész <span class="tab-count" id="cnt-ready" style="background:var(--purple)">0</span>
    </button>
    <button class="tab" id="tab-done" onclick="switchTab('done')">
      Átvett
    </button>
    <button class="tab" id="tab-map" onclick="switchTab('map')">
      🗺️ Asztaltérkép <span class="tab-count" id="cnt-map" style="background:var(--teal);color:#000">0</span>
    </button>
  </div>

  <div id="ordersList">
    <div class="loading"><div class="spinner"></div><span>Betöltés…</span></div>
  </div>
</main>

<div class="notif" id="notif">
  <div class="notif-title">🆕 Új rendelés</div>
  <div class="notif-body" id="notifBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ── CONFIG ──────────────────────────────────────────────────────────────── */
  const SUPABASE_URL  = 'https://jtwkhpptlcvdshegnrln.supabase.co';
  const SUPABASE_KEY  = 'sb_publishable_GTRTfY8YJLIU-5hPm4ZaIA_0LmgqaiK';
  const ADMIN_PASSWORD = 'tothbufe2026'; // Módosítható
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ── AUTH ────────────────────────────────────────────────────────────────── */
  function login() {
    const pw = document.getElementById('pwInput').value;
    if (pw === ADMIN_PASSWORD) {
      sessionStorage.setItem('admin_auth', '1');
      document.getElementById('loginOverlay').style.display = 'none';
      initAdmin();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('pwInput').value = '';
    }
  }
  function logout() {
    sessionStorage.removeItem('admin_auth');
    location.reload();
  }

  // Check if already logged in
  if (sessionStorage.getItem('admin_auth') === '1') {
    document.getElementById('loginOverlay').style.display = 'none';
  }

  /* ── STATE ───────────────────────────────────────────────────────────────── */
  let orders   = [];
  let activeTab = 'pending';

  /* ── INIT ────────────────────────────────────────────────────────────────── */
  async function initAdmin() {
    await loadOrders();
    subscribeRealtime();
  }

  if (sessionStorage.getItem('admin_auth') === '1') {
    initAdmin();
  }

  /* ── LOAD ORDERS ─────────────────────────────────────────────────────────── */
  async function loadOrders() {
    const today = new Date().toISOString().split('T')[0];
    const { data, error } = await db
      .from('orders')
      .select('*, products(name, emoji, price)')
      .gte('created_at', today + 'T00:00:00Z')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('ordersList').innerHTML = `<div style="color:var(--coral);padding:2rem">Hiba: ${error.message}</div>`;
      return;
    }

    orders = data || [];
    renderAll();
  }

  /* ── RENDER ──────────────────────────────────────────────────────────────── */
  function renderAll() {
    updateStats();
    renderOrders();
  }

  function updateStats() {
    const today = new Date().toISOString().split('T')[0];
    const todayOrders = orders.filter(o => o.created_at.startsWith(today));

    const pending = orders.filter(o => o.status === 'pending').length;
    const ready   = orders.filter(o => o.status === 'ready').length;
    const done    = todayOrders.filter(o => o.status === 'done').length;
    const revenue = todayOrders
      .filter(o => o.status === 'done')
      .reduce((sum, o) => sum + (o.products?.price || 0), 0);

    const activeWithTable = orders.filter(o => o.status !== 'done' && o.table_number && o.table_number !== 'Elvitel').length;

    document.getElementById('statPending').textContent = pending;
    document.getElementById('statReady').textContent   = ready;
    document.getElementById('statDone').textContent    = done;
    document.getElementById('statRevenue').textContent = revenue.toLocaleString('hu-HU');

    document.getElementById('cnt-pending').textContent = pending;
    document.getElementById('cnt-ready').textContent   = ready;
    const cntMap = document.getElementById('cnt-map');
    if (cntMap) cntMap.textContent = activeWithTable;
  }

  function renderOrders() {
    const list = document.getElementById('ordersList');
    
    if (activeTab === 'map') {
      renderMap();
      return;
    }

    const filtered = orders.filter(o => o.status === activeTab);

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">${activeTab === 'pending' ? '🎉' : activeTab === 'ready' ? '🔔' : '✅'}</div>
          <p>${activeTab === 'pending' ? 'Nincs várakozó rendelés!' : activeTab === 'ready' ? 'Nincs kész rendelés.' : 'Még nincsenek átvett rendelések.'}</p>
        </div>`;
      return;
    }

    list.innerHTML = `<div class="orders-list">
      ${filtered.map(o => renderOrderCard(o)).join('')}
    </div>`;
  }

  function renderOrderCard(o) {
    const product = o.products;
    const timeStr = new Date(o.created_at).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });

    const tableTag = o.table_number && o.table_number !== 'Elvitel' 
      ? `<span style="background:rgba(0,212,170,0.15);color:var(--teal);padding:.2rem .5rem;border-radius:6px;font-size:.75rem;font-weight:700;margin-left:.4rem;">📍 ${o.table_number}. asztal</span>`
      : `<span style="background:rgba(255,255,255,0.05);color:var(--muted);padding:.2rem .5rem;border-radius:6px;font-size:.75rem;margin-left:.4rem;">🎒 Elvitel</span>`;

    const actionBtns = o.status === 'pending'
      ? `<button class="btn-action btn-ready" onclick="setStatus('${o.id}','ready')">🔔 Kész</button>`
      : o.status === 'ready'
      ? `<button class="btn-action btn-done" onclick="setStatus('${o.id}','done')">✅ Átvéve</button>`
      : `<span class="btn-done-state">✅ Átvéve</span>`;

    return `
      <div class="order-card status-${o.status}" id="card-${o.id}">
        <div class="order-emoji">${product?.emoji || '🍽️'}</div>
        <div class="order-info">
          <div class="order-name">${esc(o.student_name)} · <span style="color:var(--muted)">${esc(o.student_class)}</span>${tableTag}</div>
          <div class="order-detail">${esc(o.items_summary || (product?.name || '–'))} · ${product?.price || 0} Ft</div>
        </div>
        <div class="order-time">${timeStr}</div>
        <div class="order-actions">${actionBtns}</div>
      </div>`;
  }

  function renderMap() {
    const list = document.getElementById('ordersList');
    const activeOrders = orders.filter(o => o.status !== 'done');
    const tableNumbers = ['1', '2', '3', '4', '5', '6'];

    const tableMap = {};
    tableNumbers.forEach(n => tableMap[n] = []);
    const takeAwayOrders = [];

    activeOrders.forEach(o => {
      if (o.table_number && tableMap[o.table_number]) {
        tableMap[o.table_number].push(o);
      } else {
        takeAwayOrders.push(o);
      }
    });

    list.innerHTML = `
      <div style="background:#0a0a18;border:1px solid rgba(0,212,170,0.3);border-radius:24px;padding:2rem;position:relative;background-image:radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);background-size:24px 24px;">
        
        <!-- TOP: PULT & KONYHA -->
        <div style="background:linear-gradient(90deg, #15152a, #1f1f3d);border:2px solid var(--coral);border-radius:16px;padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem;box-shadow:0 10px 30px rgba(244,132,95,0.15);position:relative;">
          <div style="display:flex;align-items:center;gap:1rem;">
            <span style="font-size:2.2rem;">🥪</span>
            <div>
              <div style="font-weight:900;font-size:1.1rem;color:var(--coral);letter-spacing:.05em;">BÜFÉ KIADÓ PULT & KASSZA</div>
              <div style="font-size:.78rem;color:var(--muted);">Elviteles rendelések átvételi pontja</div>
            </div>
          </div>
          <div style="background:rgba(244,132,95,0.15);border:1px solid var(--coral);padding:.5rem 1.25rem;border-radius:12px;text-align:right;">
            <div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;font-weight:700;">🎒 Pulti átvétel</div>
            <div style="font-size:1.1rem;font-weight:900;color:var(--coral);">${takeAwayOrders.length} db várakozik</div>
          </div>
        </div>

        <!-- MAIN FLOOR PLAN TÉRKEP -->
        <div style="position:relative;">
          <!-- MAP TITLE -->
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding:0 .5rem;">
            <span style="font-weight:900;font-size:.85rem;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;">🏛️ ÉTKEZŐ TEREM ALAPRAJZ (6 ASZTAL)</span>
            <span style="font-size:.75rem;color:var(--muted);background:rgba(255,255,255,0.04);padding:.3rem .7rem;border-radius:8px;border:1px solid var(--border);">🚪 BEJÁRAT A JOBB OLDALON →</span>
          </div>

          <!-- TABLES GRID -->
          <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:1.75rem;">
            ${tableNumbers.map(n => {
              const tableOrders = tableMap[n];
              const hasPending = tableOrders.some(o => o.status === 'pending');
              const hasReady = tableOrders.some(o => o.status === 'ready');
              
              const borderStyle = hasPending 
                ? 'border:2px solid var(--coral);box-shadow:0 0 25px rgba(244,132,95,0.3);background:rgba(244,132,95,0.04);' 
                : hasReady 
                ? 'border:2px solid var(--teal);box-shadow:0 0 25px rgba(0,212,170,0.3);background:rgba(0,212,170,0.04);' 
                : 'border:2px dashed rgba(255,255,255,0.12);background:rgba(255,255,255,0.01);';

              return `
                <div style="border-radius:20px;padding:1.25rem;min-height:190px;display:flex;flex-direction:column;position:relative;transition:all .3s;${borderStyle}">
                  
                  <!-- PHYSICAL CHAIR GRAPHICS (TOP & BOTTOM CHAIRS) -->
                  <div style="display:flex;justify-content:space-around;margin-bottom:.5rem;opacity:.5;">
                    <div style="width:24px;height:6px;background:var(--border);border-radius:4px;"></div>
                    <div style="width:24px;height:6px;background:var(--border);border-radius:4px;"></div>
                  </div>

                  <!-- TABLE TOP BAR -->
                  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:.5rem;margin-bottom:.75rem;">
                    <div style="display:flex;align-items:center;gap:.4rem;">
                      <span style="font-weight:900;font-size:1.1rem;color:var(--text);">📍 ${n}. ASZTAL</span>
                    </div>
                    <span style="font-size:.65rem;font-weight:800;padding:.2rem .6rem;border-radius:12px;background:${hasPending ? 'var(--coral)' : hasReady ? 'var(--teal)' : 'rgba(255,255,255,0.08)'};color:${hasPending || hasReady ? '#000' : 'var(--muted)'};">
                      ${hasPending ? '⏳ KÉSZÍTÉS' : hasReady ? '🔔 KISZÁLLÍTANDÓ' : 'SZABAD'}
                    </span>
                  </div>

                  <!-- ORDERS LIST FOR THIS TABLE -->
                  <div style="display:flex;flex-direction:column;gap:.6rem;flex:1;">
                    ${tableOrders.length ? tableOrders.map(o => `
                      <div style="background:rgba(13,13,31,0.8);border:1px solid var(--border);border-radius:10px;padding:.6rem .75rem;font-size:.8rem;display:flex;justify-content:space-between;align-items:center;">
                        <div>
                          <div style="font-weight:800;color:var(--text);">${esc(o.student_name)} (${esc(o.student_class)})</div>
                          <div style="font-size:.72rem;color:var(--yellow);font-weight:700;margin-top:.1rem;">${esc(o.items_summary || ((o.products?.emoji || '') + ' ' + (o.products?.name || '')))}</div>
                        </div>
                        <div>
                          ${o.status === 'pending' 
                            ? `<button class="btn-action btn-ready" style="padding:.3rem .6rem;font-size:.72rem;" onclick="setStatus('${o.id}','ready')">🔔 Kész</button>`
                            : `<button class="btn-action btn-done" style="padding:.3rem .6rem;font-size:.72rem;" onclick="setStatus('${o.id}','done')">✅ Átadtam</button>`}
                        </div>
                      </div>
                    `).join('') : '<div style="color:var(--muted);font-size:.75rem;text-align:center;margin:auto;font-family:var(--mono);">[ Asztal üres ]</div>'}
                  </div>

                  <!-- PHYSICAL CHAIR GRAPHICS (BOTTOM CHAIRS) -->
                  <div style="display:flex;justify-content:space-around;margin-top:.75rem;opacity:.5;">
                    <div style="width:24px;height:6px;background:var(--border);border-radius:4px;"></div>
                    <div style="width:24px;height:6px;background:var(--border);border-radius:4px;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  /* ── ACTIONS ─────────────────────────────────────────────────────────────── */
  async function setStatus(orderId, newStatus) {
    const { error } = await db
      .from('orders')
      .update({ status: newStatus })
      .eq('id', orderId);

    if (!error) {
      const idx = orders.findIndex(o => o.id === orderId);
      if (idx !== -1) orders[idx].status = newStatus;
      renderAll();
    }
  }

  /* ── TABS ────────────────────────────────────────────────────────────────── */
  function switchTab(tab) {
    activeTab = tab;
    ['pending','ready','done','map'].forEach(t => {
      const el = document.getElementById('tab-'+t);
      if (el) el.classList.toggle('active', t === tab);
    });
    renderOrders();
  }

  /* ── REALTIME ────────────────────────────────────────────────────────────── */
  function subscribeRealtime() {
    db.channel('admin-orders')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'orders'
      }, async payload => {
        // Fetch with product info
        const { data } = await db
          .from('orders')
          .select('*, products(name, emoji, price)')
          .eq('id', payload.new.id)
          .single();

        if (data) {
          orders.unshift(data);
          renderAll();
          showNotif(data);
        }
      })
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'orders'
      }, payload => {
        const idx = orders.findIndex(o => o.id === payload.new.id);
        if (idx !== -1) {
          orders[idx] = { ...orders[idx], ...payload.new };
          renderAll();
        }
      })
      .subscribe();
  }

  /* ── NOTIFICATION ────────────────────────────────────────────────────────── */
  function showNotif(order) {
    const notif = document.getElementById('notif');
    document.getElementById('notifBody').textContent =
      `${order.products?.emoji} ${esc(order.student_name)} (${esc(order.student_class)}) – ${order.products?.name}`;
    notif.classList.add('show', 'new-order');

    // Play a gentle beep
    try {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}

    setTimeout(() => notif.classList.remove('show'), 5000);
  }

  /* ── UTILS ───────────────────────────────────────────────────────────────── */
  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
