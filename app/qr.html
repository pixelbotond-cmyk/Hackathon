<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TóthBüfé – QR-kód</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230D0D1F"/><rect x="25" y="25" width="20" height="20" rx="4" fill="%2300D4AA"/></svg>' />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #06060F;
      --card:      rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --teal:      #00D4AA;
      --purple:    #8B5CF6;
      --coral:     #F4845F;
      --yellow:    #F5C518;
      --text:      #E8E8F0;
      --muted:     #6B7280;
      --ff:        'Outfit', sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem 4rem;
    }

    nav {
      width: 100%; max-width: 440px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2rem;
    }
    .nav-logo { font-weight: 900; font-size: 1.1rem; }
    .nav-logo span { color: var(--teal); }
    .nav-back {
      font-size: .85rem; color: var(--muted);
      text-decoration: none; transition: color .2s;
    }
    .nav-back:hover { color: var(--teal); }

    /* QR CARD */
    .qr-card {
      width: 100%; max-width: 380px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2rem 1.75rem;
      display: flex; flex-direction: column; align-items: center;
      gap: 1.25rem;
      box-shadow: 0 40px 80px rgba(0,0,0,.5);
      position: relative; overflow: hidden;
      transition: border-color .6s;
    }
    .qr-card.status-pending  { border-color: rgba(0,212,170,.3); }
    .qr-card.status-ready    { border-color: rgba(139,92,246,.6); }
    .qr-card.status-done     { border-color: rgba(0,212,170,.8); }

    .qr-card::before {
      content: '';
      position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(0,212,170,.07), transparent 70%);
      pointer-events: none;
    }

    .status-badge {
      font-size: .7rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; padding: .3rem .8rem;
      border-radius: 20px; border: 1px solid;
      transition: all .6s;
    }
    .badge-pending { color: var(--teal);   border-color: rgba(0,212,170,.4);   background: rgba(0,212,170,.08); }
    .badge-ready   { color: var(--purple); border-color: rgba(139,92,246,.4);  background: rgba(139,92,246,.08); }
    .badge-done    { color: var(--teal);   border-color: rgba(0,212,170,.6);   background: rgba(0,212,170,.12); }

    /* QR */
    .qr-wrapper {
      width: 200px; height: 200px;
      background: #fff; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 10px; flex-shrink: 0;
      box-shadow: 0 8px 32px rgba(0,212,170,.15);
      overflow: hidden;
      position: relative;
    }
    .qr-wrapper canvas, .qr-wrapper img {
      max-width: 180px !important;
      max-height: 180px !important;
      width: 180px !important;
      height: 180px !important;
      border-radius: 8px;
      object-fit: contain;
    }

    .table-btn {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: .55rem .3rem; color: var(--text);
      font-family: var(--ff); font-size: .75rem; font-weight: 700;
      cursor: pointer; transition: all .2s;
    }
    .table-btn:hover { border-color: var(--teal); }
    .table-btn.active {
      background: rgba(0,212,170,0.15);
      border-color: var(--teal); color: var(--teal);
    }

    /* INFO */
    .order-info { width: 100%; }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: .6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--muted); }
    .info-row .val { font-weight: 700; }
    .info-row .price { color: var(--yellow); font-family: var(--mono); font-size: 1.1rem; }

    /* STATUS DISPLAY */
    .status-display {
      text-align: center; padding: 1rem;
      border-radius: 16px; border: 1px solid var(--border);
      width: 100%;
      transition: all .6s;
    }
    .status-display .status-icon { font-size: 2rem; }
    .status-display .status-msg {
      font-size: .9rem; margin-top: .4rem; color: var(--muted);
    }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .5; }
    }

    /* DONE state */
    .done-overlay {
      position: fixed; inset: 0;
      background: rgba(0,212,170,.04);
      pointer-events: none;
      opacity: 0; transition: opacity .6s;
    }
    .done-overlay.show { opacity: 1; }

    /* LOADING */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      gap: 1rem; color: var(--muted); font-size: .9rem;
      padding: 3rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      text-align: center; padding: 3rem 1.5rem;
      color: var(--coral);
    }
    .error-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
    .error-state a {
      display: inline-block; margin-top: 1.5rem;
      color: var(--teal); text-decoration: none; font-weight: 600;
    }

    .hint {
      font-size: .78rem; color: var(--muted); text-align: center;
      max-width: 280px;
    }
  </style>
</head>
<body>

<div class="done-overlay" id="doneOverlay"></div>

<nav>
  <div class="nav-logo">TóthBüfé <span>QR</span></div>
  <a href="index.html" class="nav-back">← Új rendelés</a>
</nav>

<div id="root">
  <div class="loading">
    <div class="spinner"></div>
    <span>Rendelés betöltése…</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const SUPABASE_URL = 'https://jtwkhpptlcvdshegnrln.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_GTRTfY8YJLIU-5hPm4ZaIA_0LmgqaiK';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(location.search);
  const qrHash = params.get('hash');

  let currentOrder = null;
  let realtimeSub  = null;

  const STATUS_LABELS = {
    pending: 'Feldolgozás alatt…',
    ready:   '🔔 KÉSZ – Vedd át a büfénél!',
    done:    '✅ Átvéve – Jó étvágyat!'
  };
  const STATUS_ICONS = {
    pending: '<span class="pulse">⏳</span>',
    ready:   '🔔',
    done:    '✅'
  };

  async function init() {
    if (!qrHash) {
      renderError('Érvénytelen link – nincs rendelési azonosító.');
      return;
    }

    const { data, error } = await db
      .from('orders')
      .select('*, products(name, emoji, price)')
      .eq('qr_hash', qrHash)
      .single();

    if (error || !data) {
      renderError('Nem találtuk a rendelést. Ellenőrizd a linket.');
      return;
    }

    currentOrder = data;
    renderCard(data);
    subscribeRealtime(data.id);
  }

  function renderCard(order) {
    const status = order.status;
    const product = order.products;

    document.getElementById('root').innerHTML = `
      <div class="qr-card status-${status}" id="qrCard">
        <span class="status-badge badge-${status}" id="statusBadge">
          ${status === 'pending' ? 'Várakozás' : status === 'ready' ? 'Átvehető!' : 'Kész'}
        </span>

        <div class="qr-wrapper" id="qrWrapper"></div>

        <div class="order-info">
          <div class="info-row">
            <span class="label">Diák</span>
            <span class="val">${esc(order.student_name)} · ${esc(order.student_class)}</span>
          </div>
          <div class="info-row">
            <span class="label">Termék(ek)</span>
            <span class="val">${esc(order.items_summary || ((product?.emoji || '') + ' ' + (product?.name || '')))}</span>
          </div>
          <div class="info-row">
            <span class="label">Fizetendő</span>
            <span class="val price">${product.price} Ft</span>
          </div>
        </div>

        <!-- TABLE SELECTION -->
        <div class="table-select-box" style="width:100%;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:16px;padding:1.1rem;text-align:center;">
          <div style="font-size:.75rem;font-weight:800;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem;">📍 Hol fogsz enni? (Asztalválasztás)</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;">
            <button class="table-btn ${!order.table_number || order.table_number === 'Elvitel' ? 'active' : ''}" onclick="setTable('Elvitel')">🎒 Elvitel</button>
            <button class="table-btn ${order.table_number === '1' ? 'active' : ''}" onclick="setTable('1')">1. asztal</button>
            <button class="table-btn ${order.table_number === '2' ? 'active' : ''}" onclick="setTable('2')">2. asztal</button>
            <button class="table-btn ${order.table_number === '3' ? 'active' : ''}" onclick="setTable('3')">3. asztal</button>
            <button class="table-btn ${order.table_number === '4' ? 'active' : ''}" onclick="setTable('4')">4. asztal</button>
            <button class="table-btn ${order.table_number === '5' ? 'active' : ''}" onclick="setTable('5')">5. asztal</button>
            <button class="table-btn ${order.table_number === '6' ? 'active' : ''}" onclick="setTable('6')">6. asztal</button>
          </div>
          <div id="tableMsg" style="font-size:.75rem;color:var(--muted);margin-top:.6rem;">
            ${order.table_number && order.table_number !== 'Elvitel' ? `✅ Kiszállítás a(z) <strong>${order.table_number}. asztalhoz</strong>!` : 'Pultnál történő átvétel (Elvitel)'}
          </div>
        </div>

        <div class="status-display" id="statusDisplay">
          <div class="status-icon" id="statusIcon">${STATUS_ICONS[status]}</div>
          <div class="status-msg" id="statusMsg">${STATUS_LABELS[status]}</div>
        </div>

        <p class="hint">Mutasd ezt a QR-kódot a büfés néniknek az átvételkor.</p>
      </div>
    `;

    // Generate real QR
    const wrapper = document.getElementById('qrWrapper');
    try {
      new QRCode(wrapper, {
        text: `tothbufe-order:${qrHash}`,
        width: 180,
        height: 180,
        colorDark: '#06060F',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      setTimeout(() => {
        const c = wrapper.querySelector('canvas');
        if (c) c.style.cssText = 'display:block!important;width:180px!important;height:180px!important;border-radius:8px;';
        const i = wrapper.querySelector('img');
        if (i) i.style.display = 'none';
      }, 150);
    } catch(e) {
      // fallback
      const img = document.createElement('img');
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent('tothbufe-order:'+qrHash)}`;
      img.alt = 'QR-kód';
      img.style.cssText = 'width:180px;height:180px;border-radius:8px;';
      wrapper.appendChild(img);
    }
  }

  function updateStatus(newStatus) {
    const card   = document.getElementById('qrCard');
    const badge  = document.getElementById('statusBadge');
    const icon   = document.getElementById('statusIcon');
    const msg    = document.getElementById('statusMsg');

    if (!card) return;

    card.className = `qr-card status-${newStatus}`;
    badge.className = `status-badge badge-${newStatus}`;
    badge.textContent = newStatus === 'pending' ? 'Várakozás' : newStatus === 'ready' ? 'Átvehető!' : 'Kész';
    icon.innerHTML = STATUS_ICONS[newStatus];
    msg.textContent = STATUS_LABELS[newStatus];

    if (newStatus === 'done') {
      document.getElementById('doneOverlay').classList.add('show');
    }
  }

  function subscribeRealtime(orderId) {
    realtimeSub = db
      .channel('order-status-' + orderId)
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'orders',
        filter: `id=eq.${orderId}`
      }, payload => {
        if (payload.new && payload.new.status !== currentOrder.status) {
          currentOrder.status = payload.new.status;
          updateStatus(payload.new.status);
        }
      })
      .subscribe();
  }

  function renderError(msg) {
    document.getElementById('root').innerHTML = `
      <div class="error-state">
        <div class="emoji">😕</div>
        <p>${msg}</p>
        <a href="index.html">← Új rendelés indítása</a>
      </div>
    `;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function setTable(num) {
    if (!currentOrder) return;
    currentOrder.table_number = num;

    document.querySelectorAll('.table-btn').forEach(b => {
      const isTarget = num === 'Elvitel' ? b.textContent.includes('Elvitel') : b.textContent.includes(`${num}. asztal`);
      b.classList.toggle('active', isTarget);
    });

    const msg = document.getElementById('tableMsg');
    if (msg) {
      msg.innerHTML = num !== 'Elvitel' ? `✅ Kiszállítás a(z) <strong>${num}. asztalhoz</strong>!` : 'Pultnál történő átvétel (Elvitel)';
    }

    try {
      await db.from('orders').update({ table_number: num }).eq('id', currentOrder.id);
    } catch(e) {
      console.error('Table update err:', e);
    }
  }

  init();
</script>
</body>
</html>
