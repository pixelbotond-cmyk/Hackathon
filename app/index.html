<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TóthBüfé – Rendelés</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230D0D1F"/><rect x="25" y="25" width="20" height="20" rx="4" fill="%2300D4AA"/><rect x="55" y="25" width="20" height="20" rx="4" fill="%238B5CF6"/><rect x="25" y="55" width="20" height="20" rx="4" fill="%23F4845F"/><rect x="55" y="55" width="20" height="20" rx="4" fill="%23F5C518"/></svg>' />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #06060F;
      --surface:   #0D0D1F;
      --card:      rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --teal:      #00D4AA;
      --teal-dim:  rgba(0,212,170,0.15);
      --purple:    #8B5CF6;
      --purple-dim:rgba(139,92,246,0.15);
      --coral:     #F4845F;
      --yellow:    #F5C518;
      --text:      #E8E8F0;
      --muted:     #6B7280;
      --ff:        'Outfit', sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--ff);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,6,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-weight: 900; font-size: 1.1rem; letter-spacing: -.02em;
    }
    .nav-logo span { color: var(--teal); }
    .nav-back {
      font-size: .85rem; color: var(--muted);
      text-decoration: none;
      display: flex; align-items: center; gap: .4rem;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--teal); }
    .step-indicator {
      display: flex; align-items: center; gap: .5rem;
      font-size: .8rem; font-family: var(--mono); color: var(--muted);
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border);
      transition: background .3s;
    }
    .step-dot.active { background: var(--teal); }
    .step-dot.done   { background: var(--purple); }

    /* MAIN */
    main { max-width: 620px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    /* STEP SECTIONS */
    .step-section { display: none; }
    .step-section.active { display: block; animation: fadeUp .4s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* TYPOGRAPHY */
    .step-tag {
      font-size: .7rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--teal);
      margin-bottom: .5rem;
    }
    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 900; letter-spacing: -.04em; line-height: 1.15; margin-bottom: .75rem; }
    .subtitle { font-size: 1rem; color: var(--muted); margin-bottom: 2.5rem; }

    /* FORM */
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .5rem; color: var(--text); }
    input, select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .875rem 1rem;
      color: var(--text);
      font-family: var(--ff);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,212,170,.12);
    }
    input::placeholder { color: var(--muted); }
    select option { background: #1a1a2e; }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .875rem 2rem;
      border-radius: 12px; border: none; cursor: pointer;
      font-family: var(--ff); font-size: 1rem; font-weight: 700;
      transition: transform .2s, box-shadow .2s, opacity .2s;
      width: 100%;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--teal); color: #06060F;
    }
    .btn-primary:hover { box-shadow: 0 8px 24px rgba(0,212,170,.35); }
    .btn-ghost {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--teal); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

    /* MENU GRID */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .menu-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      cursor: pointer;
      transition: border-color .2s, transform .2s, background .2s;
      position: relative;
      user-select: none;
    }
    .menu-card:hover { transform: translateY(-3px); border-color: rgba(0,212,170,.4); }
    .menu-card.selected {
      border-color: var(--teal);
      background: var(--teal-dim);
    }
    .menu-card.selected::after {
      content: '✓';
      position: absolute; top: .75rem; right: .75rem;
      width: 22px; height: 22px;
      background: var(--teal); color: #06060F;
      border-radius: 50%; font-size: .8rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .menu-card.unavailable { opacity: .35; cursor: not-allowed; }
    .menu-card.unavailable:hover { transform: none; border-color: var(--border); }
    .menu-emoji { font-size: 2.5rem; margin-bottom: .75rem; }
    .menu-name { font-size: .95rem; font-weight: 700; margin-bottom: .25rem; }
    .menu-price {
      font-size: 1.2rem; font-weight: 900;
      font-family: var(--mono); color: var(--yellow);
    }
    .menu-stock { font-size: .72rem; color: var(--muted); margin-top: .2rem; }

    /* SUMMARY CARD */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: .6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row .label { color: var(--muted); }
    .summary-row .val { font-weight: 700; }
    .summary-row.total .val { color: var(--yellow); font-size: 1.2rem; font-family: var(--mono); }

    /* LOADING */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 4rem 2rem; gap: 1rem;
      color: var(--muted); font-size: .9rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR */
    .error-box {
      background: rgba(244,132,95,.1);
      border: 1px solid rgba(244,132,95,.3);
      border-radius: 12px; padding: 1rem 1.25rem;
      color: var(--coral); font-size: .875rem;
      margin-bottom: 1rem; display: none;
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: .875rem 1.5rem;
      font-size: .9rem; font-weight: 600;
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(0,212,170,.4); color: var(--teal); }
    .toast.error   { border-color: rgba(244,132,95,.4); color: var(--coral); }

    @media (max-width: 480px) {
      .menu-grid { grid-template-columns: 1fr; }
      nav { padding: .75rem 1.25rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">TóthBüfé <span>QR</span></div>
  <div class="step-indicator">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>
  <a href="../" class="nav-back">← Vissza</a>
</nav>

<main>
  <!-- STEP 1: Azonosítás -->
  <section class="step-section active" id="step1">
    <div class="step-tag">1. lépés</div>
    <h1>Ki rendel?</h1>
    <p class="subtitle">Add meg a neved és az osztályodat, hogy tudjuk, kinek készítsük el a rendelésed.</p>

    <div id="errorBox1" class="error-box"></div>

    <div class="form-group">
      <label for="studentName">Teljes neved</label>
      <input type="text" id="studentName" placeholder="pl. Kovács Ádám" autocomplete="name" maxlength="60" />
    </div>
    <div class="form-group">
      <label for="studentClass">Osztályod</label>
      <select id="studentClass">
        <option value="">Válassz osztályt…</option>
        <option>9/A</option><option>9/B</option><option>9/C</option>
        <option>10/A</option><option>10/B</option><option>10/C</option>
        <option>11/A</option><option>11/B</option><option>11/C</option>
        <option>12/A</option><option>12/B</option><option>12/C</option>
        <option>Tanár</option>
      </select>
    </div>


    <button type="button" class="btn btn-primary" onclick="goStep2()">Tovább a menühöz →</button>
  </section>

  <!-- STEP 2: Menü -->
  <section class="step-section" id="step2">
    <div class="step-tag">2. lépés</div>
    <h1>Válassz a menüből</h1>
    <p class="subtitle">Kattints a termékre, amit szeretnél rendelni.</p>

    <div id="menuContainer">
      <div class="loading">
        <div class="spinner"></div>
        <span>Menü betöltése…</span>
      </div>
    </div>

    <button class="btn btn-primary" id="btnToStep3" onclick="goStep3()" disabled>
      Rendelés áttekintése →
    </button>
    <br/><br/>
    <button class="btn btn-ghost" onclick="goStep1()">← Vissza</button>
  </section>

  <!-- STEP 3: Megerősítés -->
  <section class="step-section" id="step3">
    <div class="step-tag">3. lépés</div>
    <h1>Rendelés leadása</h1>
    <p class="subtitle">Ellenőrizd az adataidat, majd add le a rendelésed!</p>

    <div id="errorBox3" class="error-box"></div>

    <div class="summary-card" id="summaryCard">
      <!-- JS tölti fel -->
    </div>

    <button class="btn btn-primary" id="btnOrder" onclick="placeOrder()">
      🎯 Leadom a rendelést!
    </button>
    <br/><br/>
    <button class="btn btn-ghost" onclick="goStep2()">← Módosítás</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ── STATE ──────────────────────────────────────────────────────────────── */
  let state = {
    name: '',
    cls:  '',
    products: [],
    selectedId: null,
    selectedProduct: null,
  };

  /* ── SUPABASE INIT ──────────────────────────────────────────────────────── */
  const SUPABASE_URL = 'https://jtwkhpptlcvdshegnrln.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_GTRTfY8YJLIU-5hPm4ZaIA_0LmgqaiK';
  let db = null;
  try {
    if (window.supabase) {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } else {
      console.error("Supabase JS not loaded");
    }
  } catch(e) {
    console.error("Supabase init error:", e);
  }

  /* ── HELPERS ────────────────────────────────────────────────────────────── */
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearError(id) {
    const el = document.getElementById(id);
    el.style.display = 'none';
  }

  function updateDots(step) {
    ['dot1','dot2','dot3'].forEach((id,i) => {
      const d = document.getElementById(id);
      d.className = 'step-dot' + (i+1 < step ? ' done' : i+1 === step ? ' active' : '');
    });
  }

  function showStep(n) {
    document.querySelectorAll('.step-section').forEach(s => s.classList.remove('active'));
    document.getElementById('step'+n).classList.add('active');
    updateDots(n);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ── STEP 1 ─────────────────────────────────────────────────────────────── */
  function goStep1() { showStep(1); }

  function goStep2() {
    clearError('errorBox1');
    const name = document.getElementById('studentName').value.trim();
    const cls  = document.getElementById('studentClass').value;

    if (!name || name.length < 2) { showError('errorBox1', 'Kérlek add meg a teljes neved (min. 2 karakter).'); return; }
    if (!cls) { showError('errorBox1', 'Kérlek válassz osztályt.'); return; }
    if (/[<>]/.test(name)) { showError('errorBox1', 'Érvénytelen karakter a névben.'); return; }

    state.name = name;
    state.cls  = cls;
    showStep(2);
    loadMenu();
  }

  /* ── STEP 2 – MENU ──────────────────────────────────────────────────────── */
  async function loadMenu() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Menü betöltése…</span></div>';

    if (!db) {
      container.innerHTML = '<div class="error-box" style="display:block">⚠️ Hálózati hiba: A rendszer nem tudott csatlakozni. Kérlek frissítsd az oldalt vagy próbáld másik böngészőből!</div>';
      return;
    }

    try {
      const { data, error } = await db
        .from('products')
        .select('*')
        .eq('is_available', true)
        .order('price');

      if (error) throw error;
      state.products = data;
      renderMenu();
    } catch (error) {
      container.innerHTML = `<div class="error-box" style="display:block">⚠️ Nem sikerült betölteni a menüt: ${error.message}</div>`;
    }
  }

  function renderMenu() {
    const container = document.getElementById('menuContainer');
    if (!state.products.length) {
      container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem 0">Nincs elérhető termék jelenleg.</p>';
      return;
    }

    container.innerHTML = `<div class="menu-grid">
      ${state.products.map(p => `
        <div class="menu-card ${p.stock <= 0 ? 'unavailable' : ''} ${state.selectedId === p.id ? 'selected' : ''}"
             onclick="${p.stock > 0 ? `selectProduct('${p.id}')` : ''}"
             role="button" aria-label="${p.name}, ${p.price} Ft"
             tabindex="${p.stock > 0 ? 0 : -1}">
          <div class="menu-emoji">${p.emoji || '🍽️'}</div>
          <div class="menu-name">${p.name}</div>
          <div class="menu-price">${p.price} Ft</div>
          <div class="menu-stock">${p.stock > 0 ? `Készlet: ${p.stock} db` : 'Elfogyott'}</div>
        </div>
      `).join('')}
    </div>`;
  }

  function selectProduct(id) {
    state.selectedId = id;
    state.selectedProduct = state.products.find(p => p.id === id);
    renderMenu();
    document.getElementById('btnToStep3').disabled = false;
  }

  /* ── STEP 3 – ÖSSZEFOGLALÓ ──────────────────────────────────────────────── */
  function goStep3() {
    if (!state.selectedProduct) return;
    document.getElementById('summaryCard').innerHTML = `
      <div class="summary-row"><span class="label">Neved</span><span class="val">${escHtml(state.name)}</span></div>
      <div class="summary-row"><span class="label">Osztályod</span><span class="val">${escHtml(state.cls)}</span></div>
      <div class="summary-row"><span class="label">Termék</span><span class="val">${state.selectedProduct.emoji} ${escHtml(state.selectedProduct.name)}</span></div>
      <div class="summary-row total"><span class="label">Fizetendő</span><span class="val">${state.selectedProduct.price} Ft</span></div>
    `;
    showStep(3);
  }

  /* ── PLACE ORDER ────────────────────────────────────────────────────────── */
  async function placeOrder() {
    const btn = document.getElementById('btnOrder');
    btn.disabled = true;
    btn.textContent = 'Rendelés leadása…';
    clearError('errorBox3');

    const qrHash = crypto.randomUUID();

    try {
      const { error } = await db.from('orders').insert({
        student_name: state.name,
        student_class: state.cls,
        product_id: state.selectedProduct.id,
        qr_hash: qrHash,
        status: 'pending'
      });

      if (error) throw error;
      window.location.href = `qr.html?hash=${qrHash}`;
    } catch(error) {
      showError('errorBox3', `⚠️ Hiba: ${error.message}`);
      btn.disabled = false;
      btn.textContent = '🎯 Leadom a rendelést!';
    }
  }

  /* ── UTILS ──────────────────────────────────────────────────────────────── */
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
